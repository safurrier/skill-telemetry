<!DOCTYPE html>
<html lang="en" data-mode="animated">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>skill-telemetry architecture</title>
  <style>
    :root {
      color-scheme: light dark;
      --paper: #f7f2e8;
      --ink: #252923;
      --muted: #687166;
      --line: rgba(37, 41, 35, 0.16);
      --accent: #b45309;
      --panel: rgba(255, 253, 247, 0.88);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #181b18;
        --ink: #edf0e8;
        --muted: #adb7aa;
        --line: rgba(237, 240, 232, 0.17);
        --accent: #f2b35f;
        --panel: rgba(35, 39, 34, 0.94);
      }
    }
    * { box-sizing: border-box; }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    .narrow-hint { display: none; color: var(--muted); font: 0.72rem/1.4 Menlo, Consolas, monospace; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: clamp(20px, 4vw, 56px);
      color: var(--ink);
      background-color: var(--paper);
      background-image:
        linear-gradient(var(--line) 1px, transparent 1px),
        linear-gradient(90deg, var(--line) 1px, transparent 1px);
      background-size: 24px 24px;
      font-family: Georgia, "Times New Roman", serif;
    }
    main { width: min(1120px, 100%); margin: 0 auto; }
    header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: end;
      gap: 20px;
      margin-bottom: 20px;
    }
    h1 { margin: 0; font-size: clamp(1.6rem, 4vw, 2.8rem); line-height: 1; }
    .mode {
      color: var(--accent);
      font: 700 0.72rem/1.2 Menlo, Consolas, monospace;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .diagram-wrap {
      width: 100%;
      padding: clamp(12px, 3vw, 32px);
      overflow: auto;
      background: var(--panel);
      border: 1px solid var(--line);
      box-shadow: 0 16px 40px rgba(25, 30, 24, 0.12);
    }
    .diagram-wrap svg { width: 100%; height: auto; min-width: 960px; display: block; }
    .animation-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-top: 14px;
      font: 0.76rem/1.4 Menlo, Consolas, monospace;
      color: var(--muted);
    }
    button {
      padding: 7px 12px;
      color: var(--ink);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 999px;
      cursor: pointer;
    }
    button:hover, button:focus-visible { border-color: var(--accent); outline: none; }
    footer {
      margin-top: 14px;
      color: var(--muted);
      font: 0.72rem/1.5 Menlo, Consolas, monospace;
      overflow-wrap: anywhere;
    }
    @media (max-width: 640px) {
      header { grid-template-columns: 1fr; }
      .diagram-wrap { margin-inline: calc(-1 * clamp(20px, 4vw, 56px)); width: auto; }
      .diagram-wrap svg { min-width: 900px; }
      .narrow-hint { display: block; }
    }
  </style>
</head>
